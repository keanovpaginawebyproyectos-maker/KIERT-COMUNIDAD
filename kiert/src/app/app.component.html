<ion-app>
  <!-- MENÚ HAMBURGUESA -->
  <ion-menu contentId="main-content" type="overlay" class="kiert-menu">
    <ion-header>
      <ion-toolbar color="primary">
        <div class="menu-brand">
          <div class="menu-brand__logo">
            <img
              src="assets/images/logo/logo.png"
              alt="Logo KIERT"
              loading="lazy"
              (error)="onLogoError($event)"
            />
            <div class="menu-brand__fallback">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M12 6v6l4 2" />
              </svg>
            </div>
          </div>

          <span class="menu-brand__name">KIERT</span>
        </div>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list lines="none">
        <ion-menu-toggle auto-hide="false" *ngFor="let p of menuItems">
          <ion-item
            [routerLink]="p.url"
            routerDirection="root"
            detail="false"
            class="menu-item"
          >
            <ion-icon slot="start" [name]="p.icon" aria-hidden="true"></ion-icon>
            <ion-label>{{ p.title }}</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

      <div class="menu-divider"></div>

      <ion-list lines="none">
        <ion-item
          button
          (click)="toggleTheme()"
          detail="false"
          class="menu-item menu-item--theme"
        >
          <ion-icon
            slot="start"
            [name]="isDark ? 'sunny-outline' : 'moon-outline'"
            aria-hidden="true"
          ></ion-icon>
          <ion-label>
            {{ isDark ? 'Modo claro' : 'Modo oscuro' }}
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <!-- CONTENIDO PRINCIPAL -->
  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
